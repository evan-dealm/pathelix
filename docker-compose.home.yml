# Pathélix on a personal server that already runs other services, published by Cloudflare Tunnel.
#
# Self-contained (NOT an overlay of docker-compose.yml). Always go through the control script,
# which passes the project name, this file and the secrets file:
#
#   ./deploy/home/ctl.sh check | build | migrate | up | status | backup | restore <file> | ...
#
# What makes it safe next to other stacks (Dify, llama.cpp, another PostgreSQL/Redis…):
#   - its own Compose project (`pathelix`): containers, volumes and networks are all prefixed
#     `pathelix_` / `pathelix-`; no fixed container name, nothing shared with another stack;
#   - ONE published port, on the loopback interface only: 127.0.0.1:3100 → app. PostgreSQL, Redis
#     and Valhalla publish nothing (a port published by Docker bypasses ufw/nftables);
#   - PostgreSQL and Redis live on a network without any route to the outside (`internal`);
#     Redis also requires a password;
#   - memory AND CPU ceilings on every service, so a route optimisation cannot starve the
#     language models running on the same machine;
#   - migrations are never applied by the application at startup here: `ctl.sh migrate` runs
#     them, once, after a backup.
#
# Secrets: .env.production at the repository root (chmod 600, never committed) — template in
# deploy/home/env.example.

name: pathelix

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-common-env: &common-env
  NODE_ENV: production
  TZ: ${TZ:-Europe/Paris}
  USE_MOCK_DATA: "false"
  DATABASE_URL: postgresql://pathelix:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/pathelix_fleet
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  VALHALLA_URL: http://valhalla:8002
  VALHALLA_MAX_CONCURRENT: ${VALHALLA_THREADS:-2}
  OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_EMAIL: ${VAPID_EMAIL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ROUTING_API_TYPE: ${ROUTING_API_TYPE:-}
  ROUTING_API_KEY: ${ROUTING_API_KEY:-}
  ROUTING_API_URL: ${ROUTING_API_URL:-}

x-hardening: &hardening
  init: true
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-worker: &worker
  <<: *hardening
  image: pathelix-worker:${PATHELIX_VERSION:-local}
  build:
    context: .
    dockerfile: Dockerfile.worker
  environment:
    <<: *common-env
  # lifecycle.ts gives a running job 25 s to finish after SIGTERM.
  stop_grace_period: 35s
  networks: [egress, data, routing]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    shm_size: 256m
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: pathelix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pathelix_fleet
      TZ: ${TZ:-Europe/Paris}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-80}
      -c random_page_cost=1.1
      -c wal_compression=on
      -c max_wal_size=1GB
      -c log_min_duration_statement=${PG_LOG_SLOW_MS:-500}
      -c log_lock_waits=on
      -c idle_in_transaction_session_timeout=60000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathelix -d pathelix_fleet']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY:-1G}
          cpus: "${PG_CPUS:-2}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    # noeviction is mandatory (BullMQ stores jobs here). appendfsync everysec: at most one second
    # of queued jobs lost on a power cut.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY:-384M}
          cpus: "1"

  # Truck routing. First start downloads the OpenStreetMap extract and builds the tiles
  # (15–30 min, needs the full memory ceiling); later starts take seconds. The application does
  # not wait for it: until it is ready, distances fall back to straight-line estimates.
  valhalla:
    # Pinned: `latest` changes under you between two pulls.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:${VALHALLA_VERSION:-3.5.1}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    # `routing` to be reached by the app and the workers, `egress` to download the map extract.
    networks: [routing, egress]
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      tile_urls: ${VALHALLA_TILE_URLS:-https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf}
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"
      build_extra_args: "--mjolnir-concurrency ${VALHALLA_THREADS:-2}"
      # One thread keeps 0.25–0.5 GB after a matrix search; the app never sends more than
      # VALHALLA_MAX_CONCURRENT requests at once.
      server_threads: ${VALHALLA_THREADS:-2}
    healthcheck:
      # The image ships curl, not wget.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8002/status | grep -q version || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 1800s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${VALHALLA_MEMORY:-4G}
          cpus: "${VALHALLA_CPUS:-4}"

  app:
    <<: *hardening
    image: pathelix-app:${PATHELIX_VERSION:-local}
    build:
      context: .
      args:
        # Read at BUILD time (static pages, browser bundles): changing them needs a rebuild.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required (e.g. https://pathelix.com)}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    # No migration at startup (the image default runs `prisma migrate deploy` first): on this
    # server the schema only changes through `ctl.sh migrate`, after a backup.
    command: ["node", "server.js"]
    # The only port of the whole stack, loopback only: cloudflared on the host points to it.
    ports:
      - "127.0.0.1:${PATHELIX_PORT:-3100}:3000"
    environment:
      <<: *common-env
      # Session cookies are `Secure`: the public side is always HTTPS (Cloudflare).
      FORCE_HTTPS: "true"
      # Cloudflare appends the visitor address to X-Forwarded-For and cloudflared relays it
      # unchanged: the right-most entry is the real client.
      TRUSTED_PROXY_COUNT: "1"
      UPLOAD_DIR: /app/uploads
      STORAGE_DRIVER: local
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      VRP_SOLVER_THREADS: ${VRP_SOLVER_THREADS:-1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEMO_REQUEST_TO: ${DEMO_REQUEST_TO:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      NODE_OPTIONS: --max-old-space-size=${APP_HEAP_MB:-1280}
    volumes:
      - photo_storage:/app/uploads
    stop_grace_period: 30s
    networks: [egress, data, routing]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness = database only. 127.0.0.1, not localhost: busybox wget tries ::1 first.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY:-2G}
          cpus: "${APP_CPUS:-4}"

  # One-shot tools, never started by `up`: `ctl.sh migrate`, `ctl.sh migrate-status`.
  migrate:
    image: pathelix-app:${PATHELIX_VERSION:-local}
    profiles: [tools]
    restart: "no"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://pathelix:${DB_PASSWORD}@postgres:5432/pathelix_fleet
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *worker
    command: ['tsx', 'src/workers/vrpWorker.ts']
    environment:
      <<: *common-env
      VRP_CONCURRENCY: ${VRP_CONCURRENCY:-1}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f vrpWorker > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${WORKER_VRP_MEMORY:-2G}
          cpus: "${WORKER_VRP_CPUS:-4}"

  worker-pdf:
    <<: *worker
    command: ['node', 'dist/workers/pdfWorker.mjs']
    environment:
      <<: *common-env
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-1}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f pdfWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2"

  worker-ml:
    <<: *worker
    command: ['tsx', 'src/workers/mlProfileWorker.ts']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f mlProfileWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  worker-recurring:
    <<: *worker
    command: ['tsx', 'src/workers/recurringMissionsWorker.ts']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f recurringMissionsWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  worker-business:
    <<: *worker
    command: ['tsx', 'src/workers/businessWorker.ts']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f businessWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  worker-retention:
    <<: *worker
    command: ['tsx', 'src/workers/auditRetentionWorker.ts']
    environment:
      <<: *common-env
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      POSITION_RETENTION_DAYS: ${POSITION_RETENTION_DAYS:-30}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f auditRetentionWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # Optional: the tunnel as a container instead of a cloudflared installed on the host
  # (`ctl.sh up --profile tunnel`). Public hostname target in the Cloudflare dashboard:
  # http://app:3000. With cloudflared on the host, leave this off and target http://localhost:3100.
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.9.0}
    profiles: [tunnel]
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [egress]
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

networks:
  # Outbound Internet for the app and the workers (e-mail, Sentry, webhooks, address search),
  # and the network the published port lives on.
  egress:
  # PostgreSQL and Redis: no route to or from the outside.
  data:
    internal: true
  # Valhalla: reachable by the app and the workers only.
  routing:
    internal: true

volumes:
  postgres_data:
  redis_data:
  photo_storage:
  valhalla_tiles:
