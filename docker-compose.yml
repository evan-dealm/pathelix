services:

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pathelix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pathelix_fleet
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=512MB
      -c random_page_cost=1.1
      -c max_connections=100
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathelix -d pathelix_fleet']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - '8002:8002'
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"
      build_extra_args: "--mjolnir-concurrency 4"
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8002/status 2>/dev/null | grep -q version || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pathelix:${DB_PASSWORD}@postgres:5432/pathelix_fleet
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VALHALLA_URL: http://valhalla:8002
      VRP_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pathelix:${DB_PASSWORD}@postgres:5432/pathelix_fleet
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VALHALLA_URL: http://valhalla:8002
      USE_MOCK_DATA: "false"
      NESSY_WEBHOOK_SECRET: ${NESSY_WEBHOOK_SECRET:-}
      NESSY_API_URL: ${NESSY_API_URL:-}
      NESSY_API_KEY: ${NESSY_API_KEY:-}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ROUTING_API_TYPE: ${ROUTING_API_TYPE:-}
      ROUTING_API_KEY: ${ROUTING_API_KEY:-}
      ROUTING_API_URL: ${ROUTING_API_URL:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    volumes:
      - photo_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  photo_storage:
  valhalla_tiles:
