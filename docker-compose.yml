x-worker-env: &worker-env
  NODE_ENV: production
  USE_MOCK_DATA: "false"
  DATABASE_URL: postgresql://pathelix:${DB_PASSWORD}@postgres:5432/pathelix_fleet
  SESSION_SECRET: ${SESSION_SECRET}
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  VALHALLA_URL: http://valhalla:8002
  SENTRY_DSN: ${SENTRY_DSN:-}
  ROUTING_API_TYPE: ${ROUTING_API_TYPE:-}
  ROUTING_API_KEY: ${ROUTING_API_KEY:-}
  ROUTING_API_URL: ${ROUTING_API_URL:-}

x-worker-base: &worker-base
  build:
    context: .
    dockerfile: Dockerfile.worker
  image: pathelix-worker
  environment:
    <<: *worker-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pathelix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pathelix_fleet
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=512MB
      -c random_page_cost=1.1
      -c max_connections=100
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathelix -d pathelix_fleet']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    # noeviction: BullMQ stores jobs in Redis — an LRU policy silently drops queued optimisations
    # under memory pressure. When full, writes fail instead; rate limiting falls back in-process.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - '8002:8002'
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"
      build_extra_args: "--mjolnir-concurrency 4"
    healthcheck:
      # The Valhalla image ships curl, not wget: a wget probe never passes and blocks every
      # service that waits for `service_healthy`.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8002/status | grep -q version || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Background workers ────────────────────────────────────────────────────
  # All five share one image (Dockerfile.worker) and the environment below. Every worker calls
  # validateEnv() at startup and refuses to run in production without SESSION_SECRET and
  # USE_MOCK_DATA=false — so they must get the same core variables as the app.
  worker:
    <<: *worker-base
    command: ['tsx', 'src/workers/vrpWorker.ts']
    environment:
      <<: *worker-env
      VRP_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f vrpWorker > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  # Renders tour sheets and monthly reports (/api/tours/pdf, /api/reports/pdf answer 503 without it).
  worker-pdf:
    <<: *worker-base
    command: ['node', 'dist/workers/pdfWorker.mjs']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f pdfWorker > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # Nightly ML coefficient recalculation (VRP travel/service-time calibration).
  worker-ml:
    <<: *worker-base
    command: ['tsx', 'src/workers/mlProfileWorker.ts']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f mlProfileWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Generates missions from recurring templates.
  worker-recurring:
    <<: *worker-base
    command: ['tsx', 'src/workers/recurringMissionsWorker.ts']
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f recurringMissionsWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Business jobs: outbound webhook deliveries (retries, dead letters), overdue invoices,
  # expiring quotes, daily notifications.
  worker-business:
    <<: *worker-base
    command: ['tsx', 'src/workers/businessWorker.ts']
    environment:
      <<: *worker-env
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f businessWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Weighing-ticket OCR (Tesseract, CPU). Optional: `docker compose --profile ocr up`. Without it
  # the driver app simply hides the "read the ticket" button and drivers type the weight.
  ai-engine:
    build: ./ai-engine
    profiles: ['ocr']
    environment:
      REDIS_URL: redis://redis:6379
      CALLBACK_BASE_URL: http://app:3000
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:?AI_CALLBACK_SECRET is required for the OCR engine}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # Daily purge: audit log, GPS positions, idempotency keys (retention windows in env).
  worker-retention:
    <<: *worker-base
    command: ['tsx', 'src/workers/auditRetentionWorker.ts']
    environment:
      <<: *worker-env
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      POSITION_RETENTION_DAYS: ${POSITION_RETENTION_DAYS:-30}
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f auditRetentionWorker > /dev/null || exit 1']
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pathelix:${DB_PASSWORD}@postgres:5432/pathelix_fleet
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      VALHALLA_URL: http://valhalla:8002
      USE_MOCK_DATA: "false"
      UPLOAD_DIR: /app/uploads
      NESSY_WEBHOOK_SECRET: ${NESSY_WEBHOOK_SECRET:-}
      NESSY_API_URL: ${NESSY_API_URL:-}
      NESSY_API_KEY: ${NESSY_API_KEY:-}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:-}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ROUTING_API_TYPE: ${ROUTING_API_TYPE:-}
      ROUTING_API_KEY: ${ROUTING_API_KEY:-}
      ROUTING_API_URL: ${ROUTING_API_URL:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    volumes:
      - photo_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      # Readiness (database only), like the Dockerfile: /api/health also answers 503 for optional
      # dependencies (Valhalla, Redis, an open circuit breaker) and must not mark the app unhealthy.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  photo_storage:
  valhalla_tiles:
